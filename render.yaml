# Render Blueprint: New > Blueprint, point it at this repo.
services:
  - type: web
    name: inkwave
    runtime: docker
    # Free is fine for testing (it sleeps when idle). Use "starter" for an always-on game.
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # Rooms live in memory: keep exactly one instance.
    numInstances: 1
