# Render Blueprint: New > Blueprint, point it at this repo.
services:
  - type: web
    # The service name becomes the web address: quantumink.onrender.com
    # (Render adds a short suffix if that name is already taken).
    name: quantumink
    runtime: docker
    # Free is fine for testing (it sleeps when idle). Use "starter" for an always-on game.
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # Rooms live in memory: keep exactly one instance.
    numInstances: 1
