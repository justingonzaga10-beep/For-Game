<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2a2e" />
    <meta name="description" content="Quantum Doodle: draw, guess and glow. A neon multiplayer drawing and guessing game." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quantum Doodle</title>
    <script>
      // Apply the saved theme (or the device's) before first paint, so the page never flashes the wrong colours.
      try {
        var t = JSON.parse(localStorage.getItem("inkwave:theme") || "null");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
